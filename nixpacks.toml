# Fixed nixpacks.toml - Proper Node.js installation

[phases.setup]
nixPkgs = ["nodejs-18_x", "php82Packages.composer"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm install --silent"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan storage:link || true"
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
