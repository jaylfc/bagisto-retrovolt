# Minimal Bagisto nixpacks.toml - Focus on working build

[variables]
NODE_VERSION = "18"

[phases.setup] 
nixPkgs = ["nodejs_18", "php82Packages.composer"]

[phases.install]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm ci --silent"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan storage:link || true"
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
